6"/><text x="384" y="478" font-size="19" font-weight="600">raw 历史仍保留</text><text class="cd-muted" x="384" y="503" font-size="12">追加 compaction，不删除旧记录</text></g></a><path d="M40 544 H920" fill="none" stroke="var(--line)"/><text class="cd-muted" x="40" y="568" font-size="13">raw 存在 ≠ 本次模型看见；缓存命中也不能恢复未发送的信息。</text></svg></div><figcaption>keepRecentTokens 是切点预算目标，不是随意截取最后 N tokens。调用与结果不能拆散；序列化和模型摘要都可能损失信息。</figcaption><div class="diagram-actions"><a href="../chapters/08-%E4%B8%8A%E4%B8%8B%E6%96%87%E5%8E%8B%E7%BC%A9.html#c8-s4">四、prepareCompaction 先决定材料，还没调用模型</a><a href="../chapters/08-%E4%B8%8A%E4%B8%8B%E6%96%87%E5%8E%8B%E7%BC%A9.html#c8-s8">八、摘要之前就可能丢信息</a><a href="../chapters/08-%E4%B8%8A%E4%B8%8B%E6%96%87%E5%8E%8B%E7%BC%A9.html#c8-s7">七、摘要请求怎样生成</a></div><p class="diagram-hint">点击节点可跳转本章解释；窄屏可在图内横向滚动。</p></figure></main></body></html>
